<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume & ATS Analyzer</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center p-6">

    <div class="max-w-3xl w-full bg-slate-800 rounded-xl shadow-2xl p-8 border border-slate-700 my-8">
        <h1 class="text-3xl font-bold text-center text-indigo-400 mb-2">AI Resume & ATS Analyzer</h1>
        <p class="text-slate-400 text-center mb-6 text-sm">Upload your resume PDF and compute your ATS Match Score and get suggestions.</p>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-700 mb-6">
            <button id="tabAnalyzeBtn" class="py-2 px-6 font-semibold border-b-2 border-indigo-500 text-indigo-400 focus:outline-none">Analyze Resume</button>
            <button id="tabHistoryBtn" class="py-2 px-6 font-semibold text-slate-400 hover:text-slate-200 focus:outline-none">Past History</button>
        </div>

        <!-- SECTION 1: ANALYZER FORM -->
        <div id="analyzerSection">
            <form id="analyzerForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Upload Resume (PDF)</label>
                    <input type="file" id="resumeFile" accept=".pdf" required 
                           class="w-full text-slate-300 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-2">Job Description</label>
                    <textarea id="jobDescription" rows="4" placeholder="Paste any job requirements here (Tech, Marketing, Finance, HR, etc.)..." 
                              class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-3 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" 
                        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-md transition duration-200">
                    Analyze Resume
                </button>
            </form>

            <!-- Loading Spinner -->
            <div id="loading" class="hidden text-center my-6">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-indigo-400"></div>
                <p class="text-slate-400 text-sm mt-2"> Evaluating resume fit...</p>
            </div>

            <!-- Single Analysis Result View -->
            <div id="results" class="hidden mt-8 pt-6 border-t border-slate-700 space-y-6">
                <div class="text-center">
                    <p class="text-sm text-slate-400 uppercase tracking-wide">ATS Match Score</p>
                    <div id="scoreDisplay" class="text-5xl font-extrabold text-indigo-400 mt-1">0%</div>
                </div>

                <div>
                    <h3 class="text-md font-semibold text-emerald-400 mb-2">Matching Skills Found</h3>
                    <div id="matchingSkills" class="flex flex-wrap gap-2"></div>
                </div>

                <div>
                    <h3 class="text-md font-semibold text-rose-400 mb-2">Missing Skill Keywords</h3>
                    <div id="missingSkills" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- AI Advice / Suggestions Section -->
                <div class="pt-4 border-t border-slate-700">
                    <h3 class="text-md font-semibold text-indigo-400 mb-2">AI Resume Improvement Advice</h3>
                    <ul id="suggestionsList" class="list-disc list-inside text-sm text-slate-300 space-y-2 bg-slate-900 p-4 rounded-lg border border-slate-700"></ul>
                </div>
            </div>
        </div>

        <!-- SECTION 2: PAST HISTORY TABLE -->
        <div id="historySection" class="hidden">
            <h2 class="text-xl font-bold text-slate-200 mb-4">Saved Resume Analyses</h2>
            
            <div id="historyLoading" class="text-center py-6 text-slate-400">
                Loading database history...
            </div>

            <div id="historyList" class="space-y-4"></div>
        </div>

    </div>

    <!-- JavaScript logic -->
    <script>
        const tabAnalyzeBtn = document.getElementById('tabAnalyzeBtn');
        const tabHistoryBtn = document.getElementById('tabHistoryBtn');
        const analyzerSection = document.getElementById('analyzerSection');
        const historySection = document.getElementById('historySection');
        const form = document.getElementById('analyzerForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const matchingSkills = document.getElementById('matchingSkills');
        const missingSkills = document.getElementById('missingSkills');
        const suggestionsList = document.getElementById('suggestionsList');
        const submitBtn = document.getElementById('submitBtn');
        const historyList = document.getElementById('historyList');
        const historyLoading = document.getElementById('historyLoading');

        // --- TAB SWITCHING LOGIC ---
        tabAnalyzeBtn.addEventListener('click', () => {
            analyzerSection.classList.remove('hidden');
            historySection.classList.add('hidden');
            
            tabAnalyzeBtn.className = "py-2 px-6 font-semibold border-b-2 border-indigo-500 text-indigo-400 focus:outline-none";
            tabHistoryBtn.className = "py-2 px-6 font-semibold text-slate-400 hover:text-slate-200 focus:outline-none";
        });

        tabHistoryBtn.addEventListener('click', () => {
            historySection.classList.remove('hidden');
            analyzerSection.classList.add('hidden');
            
            tabHistoryBtn.className = "py-2 px-6 font-semibold border-b-2 border-indigo-500 text-indigo-400 focus:outline-none";
            tabAnalyzeBtn.className = "py-2 px-6 font-semibold text-slate-400 hover:text-slate-200 focus:outline-none";

            fetchHistory();
        });

        // --- SUBMIT FORM LOGIC ---
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const resumeInput = document.getElementById('resumeFile').files[0];
            const jobDescInput = document.getElementById('jobDescription').value;

            if (!resumeInput) {
                alert('Please select a PDF file!');
                return;
            }

            const formData = new FormData();
            formData.append('resume', resumeInput);
            formData.append('job_description', jobDescInput);

            loading.classList.remove('hidden');
            results.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/analyze/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    const analysis = data.ats_analysis;

                    scoreDisplay.innerText = `${analysis.match_score}%`;

                    matchingSkills.innerHTML = (analysis.matching_skills && analysis.matching_skills.length > 0)
                        ? analysis.matching_skills.map(s => `<span class="bg-emerald-900/60 border border-emerald-700 text-emerald-300 px-3 py-1 rounded-full text-xs font-medium">${s}</span>`).join('')
                        : `<span class="text-slate-500 text-xs">None found</span>`;

                    missingSkills.innerHTML = (analysis.missing_skills && analysis.missing_skills.length > 0)
                        ? analysis.missing_skills.map(s => `<span class="bg-rose-900/60 border border-rose-700 text-rose-300 px-3 py-1 rounded-full text-xs font-medium">${s}</span>`).join('')
                        : `<span class="text-slate-500 text-xs">No missing skills detected!</span>`;

                    suggestionsList.innerHTML = (analysis.suggestions && analysis.suggestions.length > 0)
                        ? analysis.suggestions.map(s => `<li class="leading-relaxed">${s}</li>`).join('')
                        : `<li class="text-slate-500">No suggestions provided.</li>`;

                    results.classList.remove('hidden');
                } else {
                    alert(`Error: ${data.error || 'Failed to process resume'}`);
                }
            } catch (err) {
                alert('Server error!');
                console.error(err);
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        // --- FETCH HISTORY FROM SQL DATABASE LOGIC ---
        async function fetchHistory() {
            historyLoading.classList.remove('hidden');
            historyList.innerHTML = '';

            try {
                const response = await fetch('/api/history/');
                const data = await response.json();

                if (response.ok) {
                    historyLoading.classList.add('hidden');

                    if (data.history.length === 0) {
                        historyList.innerHTML = `<p class="text-slate-500 text-center py-4">No analysis records found in database.</p>`;
                        return;
                    }

                    historyList.innerHTML = data.history.map(item => `
                        <div class="bg-slate-900 border border-slate-700 rounded-lg p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <h4 class="font-bold text-slate-200 text-md">${item.file_name}</h4>
                                <p class="text-xs text-slate-500">Saved on: ${new Date(item.created_at).toLocaleString()}</p>
                                <div class="mt-2 flex flex-wrap gap-1">
                                    ${(item.matching_skills || []).slice(0, 5).map(s => `<span class="bg-emerald-900/40 text-emerald-400 px-2 py-0.5 rounded text-[10px]">${s}</span>`).join('')}
                                </div>
                            </div>
                            <div class="text-right flex items-center gap-3">
                                <span class="text-2xl font-extrabold text-indigo-400">${item.match_score}%</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    historyLoading.innerText = "Failed to load database history.";
                }
            } catch (err) {
                historyLoading.innerText = "Connection error while fetching history.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
